name: SunWatt
options:
  bundleIdPrefix: com.ideatic
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Fill in your team ID to sign for devices (see README). Empty = Sign to Run Locally / simulator.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_LANGUAGE: en
packages:
  SunWattKit:
    path: Packages/SunWattKit
targets:
  SunWatt:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: SunWattKit
      - target: SunWattWidgets
        embed: true
        codeSign: true
      - target: SunWattWatch
        embed: true
        codeSign: true
        platformFilter: iOS
    entitlements:
      path: App/SunWatt.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ideatic.sunwatt]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SunWatt
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, fr, de, it, nl]
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    preBuildScripts:
      # Debug only: copies Config/kiosk.local (ignored by version control) into the bundle, or an empty file when
      # absent, for the debug prefill. Other configurations remove it. The content is never printed.
      - name: Debug kiosk prefill
        script: |
          set -eu
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/kiosk.local"
          if [ "${CONFIGURATION}" = "Debug" ]; then
            mkdir -p "$(dirname "${DEST}")"
            if [ -f "${SRCROOT}/Config/kiosk.local" ]; then
              cp "${SRCROOT}/Config/kiosk.local" "${DEST}"
            else
              : > "${DEST}"
            fi
          else
            rm -f "${DEST}"
          fi
        inputFiles:
          - $(SRCROOT)/Config/kiosk.local
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/kiosk.local
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideatic.sunwatt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  SunWattWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
    dependencies:
      - package: SunWattKit
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/SunWattWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ideatic.sunwatt]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: SunWatt
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, fr, de, it, nl]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideatic.sunwatt.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
  SunWattWatch:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - path: Watch
    dependencies:
      - package: SunWattKit
      - target: SunWattWatchWidgets
        embed: true
        codeSign: true
    entitlements:
      path: Watch/SunWattWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ideatic.sunwatt]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: SunWatt
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, fr, de, it, nl]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ideatic.sunwatt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideatic.sunwatt.watchkitapp
  SunWattWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - path: WatchWidgets
    dependencies:
      - package: SunWattKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: WatchWidgets/SunWattWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ideatic.sunwatt]
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: SunWatt
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, fr, de, it, nl]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideatic.sunwatt.watchkitapp.widgets
schemes:
  SunWatt:
    build:
      targets:
        SunWatt: all
        SunWattWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SunWattKit/SunWattKitTests
  SunWattWatch:
    build:
      targets:
        SunWattWatch: all
        SunWattWatchWidgets: all
    run:
      config: Debug
