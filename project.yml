name: HomeDash
options:
  bundleIdPrefix: com.ideatic
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Fill in your team ID to sign for devices (see README). Empty = Sign to Run Locally / simulator.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_LANGUAGE: en
packages:
  HomeDashKit:
    path: Packages/HomeDashKit
targets:
  HomeDash:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: HomeDashKit
      - target: HomeDashWidgets
        embed: true
        codeSign: true
    entitlements:
      path: App/HomeDash.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ideatic.homedash]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HomeDash
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, fr, de, it, nl]
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideatic.homedash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  HomeDashWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
    dependencies:
      - package: HomeDashKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/HomeDashWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ideatic.homedash]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: HomeDash
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, pt, fr, de, it, nl]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideatic.homedash.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  HomeDash:
    build:
      targets:
        HomeDash: all
        HomeDashWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: HomeDashKit/HomeDashKitTests
