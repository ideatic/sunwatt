name: Parity

# Checks FEATURES.md, the feature list shared by the Apple and the Android app (scripts/check_parity.py).
# Runs on every push and pull request, also for Android-only changes. Cheap: one Python script on Linux.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Feature parity
        run: python3 -I scripts/check_parity.py
