name: Android

# Builds and tests the Android app (android/) on Linux: unit tests of every module, debug and release builds, lint,
# and the Play listing check. Same steps as android/README.md "Build and test".
# The strings come from the Apple .xcstrings catalogs and the core tests read the Apple fixtures, so changes there
# start this job too. No secrets: without private/android_upload.properties the release build stays unsigned.

on:
  push:
    branches: [main]
    paths: ['android/**', 'apple/**/*.xcstrings', 'apple/Packages/SunWattKit/Tests/SunWattKitTests/Fixtures/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'apple/**/*.xcstrings', 'apple/Packages/SunWattKit/Tests/SunWattKitTests/Fixtures/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build logic tests
        run: ./gradlew -p build-logic test

      - name: Unit tests
        run: ./gradlew :core:test :ui-shared:testDebugUnitTest :app:testDebugUnitTest :wear:testDebugUnitTest

      - name: Builds and lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :wear:assembleDebug :wear:assembleRelease :app:lintDebug :wear:lintDebug

      - name: Play listing
        run: python3 -I play/check_listing.py play/listings

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/**/build/reports/
